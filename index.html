<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f4c43"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Indian Market News Brief</title>
<style>
:root{--bg:#eef1ee;--card:#fff;--ink:#14201c;--mute:#5b6b65;--line:#d5ddd8;--brand:#0f4c43;--gold:#b7791f;--red:#a63d2f;--ok:#2f6b3a}
@media(prefers-color-scheme:dark){:root{--bg:#101815;--card:#18221e;--ink:#e8efeb;--mute:#9bb0a7;--line:#2c3a34;--brand:#7fd1bd;--gold:#e0b04f;--red:#e88a7c;--ok:#7fc58c}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding-bottom:76px}
header{background:#0f4c43;color:#f4f1e6;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}header button{background:none;border:1px solid #f4f1e655;color:#f4f1e6;border-radius:8px;font-size:22px;line-height:1;padding:6px 11px}
#menu{position:fixed;right:10px;top:calc(60px + env(safe-area-inset-top,0px));background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px #0004;z-index:5;min-width:170px;display:none}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:14px 16px;font-size:16px;border-bottom:1px solid var(--line)}#menu button:last-child{border:0}
header h1{font:700 20px/1.2 Georgia,serif;margin:0}header p{margin:2px 0 0;font-size:13px;opacity:.85}
main{padding:14px;max-width:720px;margin:auto}
h2{font:700 19px Georgia,serif;margin:6px 0 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.warn{border-left:5px solid var(--gold)}.bad{border-left:5px solid var(--red)}
.s{border-left:4px solid var(--brand)}.s h3{margin:0 0 4px;font-size:17px}
.m{color:var(--mute);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);margin-right:4px}
.f{color:var(--ok)}.n{color:var(--mute)}.u{color:var(--gold)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:12px 2px;font-size:12px;white-space:nowrap}
nav button.on{color:var(--brand);font-weight:700;box-shadow:inset 0 3px 0 var(--brand)}
button.go{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px}
@media(prefers-color-scheme:dark){button.go{color:#101815}}
a{color:var(--brand)}.golink{display:inline-block;background:var(--brand);color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;font-size:15px}@media(prefers-color-scheme:dark){.golink{color:#101815}}button:focus-visible,a:focus-visible{outline:3px solid var(--gold)}
.tag.up{color:var(--ok);border-color:var(--ok)}.tag.down{color:var(--red);border-color:var(--red)}.foot{font-size:12px;color:var(--mute);margin-top:18px}
</style></head><body>
<header><div><h1>Indian Market News Brief</h1><p>Nifty 50 research aid. No buy or sell advice.</p></div><button aria-label="Menu" aria-expanded="false" onclick="menu()" id="mb">&#9776;</button></header>
<div id="menu"><button onclick="go('hist')">History</button><button onclick="go('cover')">Coverage checklist</button><button onclick="go('status')">Status</button></div>
<main id="v"></main>
<nav id="nav"></nav>
<script>
const FACTORS=["Global markets","US monetary policy","Global bond yields","US dollar","China and global growth","Geopolitics and trade","Rupee","Crude oil","Other commodities","GDP and growth","Inflation and consumption","RBI monetary policy","Banking and liquidity","Indian bond market","Government policy","Politics and elections","Regulation","Foreign investment","Domestic investment","Corporate earnings","Heavyweight stocks","Valuation","Sector rotation","Technical trends","Momentum indicators","Market breadth","Price and volume","Derivatives positioning","Volatility","Market structure","Corporate events","External balances","FDI and remittances","Seasonal factors","Event calendar","Investor psychology"];
const STAT={found:["Material development found","f"],none:["Checked, no material development found","n"],unverified:["Not verified","u"]};
const TABS=[["today","Today"],["report","Report"],["fii","FII/DII"],["mkt","Markets"],["events","Events"],["earn","Results"]];
let D={res:null,r:null,e:[],h:[],f:null,m:null,err:null,at:null},tab="today";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ist=d=>d?new Date(d).toLocaleString("en-IN",{timeZone:"Asia/Kolkata",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})+" IST":"not available";
const day=d=>new Date(d).toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"});
async function load(){
 try{const j=async u=>{const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error(u+" "+r.status);return r.json()};
  try{D.f=await j("data/fii_dii.json")}catch(x){D.f=null}
  try{D.m=await j("data/markets.json")}catch(x){D.m=null}
  try{D.res=await j("data/results.json")}catch(x){D.res=null}
  D.r=await j("data/latest.json");const ev=await j("data/events.json");D.e=ev.events||[];D.ev=ev.verified_on||"";D.h=(await j("data/index.json")).reports||[];D.err=null;D.at=new Date()}
 catch(x){D.err=x.message}
 draw()}
function stale(){const r=D.r;return !r||!r.generated_at||day(r.generated_at)!==day(new Date())}
function bal(r){const c={up:0,down:0,unclear:0,little:0};(r.stories||[]).forEach(s=>{if(s.lean)c[s.lean]++});const n=c.up+c.down+c.unclear+c.little;
 return n?`<div class="box"><b>Balance of today's news</b><div>${c.up} may help · ${c.down} may hurt · ${c.unclear} unclear · ${c.little} little effect</div><p class="m">A simple count of the stories below. It is not a forecast of where Nifty will go.</p></div>`:""}
function today(){const r=D.r;let h="<h2>Today</h2>"+(D.at?`<div class="m">Checked ${ist(D.at)}</div>`:"")+remBox();
 if(D.err)h+=`<div class="box bad"><b>Could not load data.</b><br>${esc(D.err)}<br>Check your internet connection and tap Refresh.</div>`;
 if(!r||r.status==="none"){return h+`<div class="box warn"><b>No report yet.</b><br>The first report appears after the daily 8:00 AM run is set up. That is the next build step.</div><button class="go" onclick="load()">Refresh</button>`}
 if(stale())h+=`<div class="box warn"><b>This is not today's report.</b><br>Latest report was generated ${ist(r.generated_at)}. Treat it as old.</div>`;
 h+=`<div class="box"><b>${esc(r.title)}</b><div class="m">Covers ${ist(r.window_start)} to ${ist(r.cutoff)}<br>Generated ${ist(r.generated_at)}</div><p>${esc(r.quick_read)}</p><button class="go" onclick="go('report')">Open full report</button></div>`+bal(r);
 return h}
function report(){const r=D.r;if(!r||!r.stories||!r.stories.length)return `<h2>Report</h2><div class="box warn">No stories available yet.</div>`;
 let h=`<h2>${esc(r.title)}</h2><div class="m">${r.stories.length} of maximum 15 stories</div>`;
 r.stories.forEach((s,i)=>{h+=`<div class="box s"><h3>${i+1}. ${esc(s.headline)}</h3><div class="m">${ist(s.time)} · ${esc((s.factors||[]).join(", "))}</div><p>${esc(s.summary)}</p>
 <p>${s.lean?`<span class="tag ${s.lean}">${{up:"May help Nifty",down:"May hurt Nifty",little:"Little effect",unclear:"Unclear"}[s.lean]||""}</span>`:""}<span class="tag">${esc(s.confirmation||"unconfirmed")}</span></p>${(s.unverified_figures||[]).length?`<p class="u"><b>Check these figures against the source:</b> ${esc(s.unverified_figures.join(", "))}</p>`:""}<p><b>Possible effect on Nifty:</b> ${esc(s.impact)}</p>
 <p class="m"><b>Sectors and stocks:</b> ${esc((s.sectors||[]).join(", "))}</p>
 ${(s.sources||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`).join(" · ")}</div>`});
 if((r.gaps||[]).length)h+=`<div class="box warn"><b>Verification gaps</b><ul>${r.gaps.map(g=>`<li>${esc(g)}</li>`).join("")}</ul></div>`;
 return h+`<p class="foot">Information and research aid only. Market reactions depend on expectations, positioning, valuation and follow-through.</p>`}
function cover(){const fs=(D.r&&D.r.factor_status)||{};
 return `<h2>Coverage checklist</h2><p class="m">Every factor must show a status. A missing status counts as Not verified.</p>`+FACTORS.map((n,i)=>{const [t,c]=STAT[fs[i+1]]||STAT.unverified;return `<div class="box" style="padding:10px 14px"><b>${i+1}. ${n}</b><br><span class="${c}">${t}</span></div>`}).join("")}
function fii(){const f=D.f||{},off=f.history||[],fmt=v=>(v<0?"-":"+")+Math.abs(v).toLocaleString("en-IN",{maximumFractionDigits:0}),lab=v=>v>0?"Net buyer":v<0?"Net seller":"Flat";
 let h="<h2>FII / DII</h2>";const L=off[0];
 if(!L)h+=`<div class="box warn"><b>Official figures: not verified.</b><br>NSE does not allow our automatic check, so none are shown. News reports are listed below when we find them.</div>`;
 else{if(f.status!=="ok")h+=`<div class="box warn">${esc(f.note||"")} Showing the latest figures available.</div>`;
  h+=`<div class="m">Provisional NSE cash market · ${esc(L.date)} · Rs crore</div>`;
  [["FII / FPI","fii"],["DII","dii"]].forEach(([n,k])=>{const x=L[k];h+=`<div class="box ${x.net<0?"bad":"s"}"><b>${n}: ${lab(x.net)}</b><div style="font:700 26px Georgia,serif">${fmt(x.net)} Cr</div><div class="m">Bought ${x.buy.toLocaleString("en-IN")} · Sold ${x.sell.toLocaleString("en-IN")}</div></div>`})}
 if((f.reported||[]).length)h+=`<div class="box warn"><b>Reported in the news, not checked against NSE</b>`+f.reported.map(r=>`<p>${esc(r.who)} ${r.direction} about Rs ${r.amount.toLocaleString("en-IN")} crore<br><span class="m">${esc(r.outlet)}${r.published?" · "+ist(r.published):""}</span><br><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.headline)}</a></p>`).join("")+`</div>`;
 else h+=`<div class="box"><b>News reports</b><p class="m">No FII/DII buying or selling figures were found in this morning's news. This is normal on some days.</p></div>`;
 h+=`<div class="box"><b>Official figures</b><p class="m">NSE publishes them after market close, about 6 to 8:30 PM IST.</p><a href="https://www.nseindia.com/reports/fii-dii" target="_blank" rel="noopener">Open the NSE FII/DII page</a></div><p class="foot">Institutional flow is context only, not a signal.</p>`;
 return h}
function mkt(){const m=D.m;let h="<h2>Markets</h2>";
 if(!m)return h+`<div class="box warn"><b>Not verified.</b><br>Market data has not been retrieved yet.</div>`;
 const f0=v=>v==null?"n/a":v.toLocaleString("en-IN",{maximumFractionDigits:0});
 if(m.nifty){const n=m.nifty;h+=`<div class="box s"><b>Nifty 50 chart numbers</b> <span class="m">close ${esc(n.date)}</span><div style="font:700 22px Georgia,serif">${f0(n.last)}</div>
  <table style="width:100%;border-collapse:collapse;margin:6px 0"><tr><td>20-day average</td><td>${f0(n.sma20)}</td></tr><tr><td>50-day average</td><td>${f0(n.sma50)}</td></tr><tr><td>200-day average</td><td>${f0(n.sma200)}</td></tr><tr><td>Last 20 days low / high</td><td>${f0(n.low20)} / ${f0(n.high20)}</td></tr><tr><td>1-year low / high</td><td>${f0(n.low52)} / ${f0(n.high52)}</td></tr><tr><td>RSI (strength, 0 to 100)</td><td>${n.rsi}</td></tr></table>
  ${n.reading.map(x=>`<p>${esc(x)}</p>`).join("")}<p class="m">These describe the past. They do not predict the next move.</p></div>`}
 const sg=(v,u)=>(v>0?"+":"")+v+(u==="%"?"%":" pts");
 m.groups.forEach(g=>{h+=`<h3 style="margin:14px 0 6px">${esc(g.name)}</h3>`;g.items.forEach(x=>{
  if(!x.ok){h+=`<div class="box"><b>${esc(x.name)}</b><br><span class="u">Not verified</span></div>`;return}
  h+=`<div class="box ${x.d5<0?"bad":"s"}" style="padding:10px 14px"><b>${esc(x.name)}</b> <span class="m">${x.live?"latest, as of "+ist(x.asof):"close "+esc(x.date)}</span><div style="font:700 20px Georgia,serif">${x.last.toLocaleString("en-IN",{maximumFractionDigits:2})}</div><div>${x.live?"Since "+esc(x.prev_date)+" close":"Day"} ${sg(x.d1,x.unit)} · ${x.sessions} sessions ${sg(x.d5,x.unit)} <b>(${esc(x.trend)})</b></div></div>`})});
 return h+`<p class="foot">Source: ${esc(m.source)}. Indices show the last completed session. Commodity futures trade almost round the clock, so they show the latest price. The trend word is a simple rule on the ${5}-session change, not a forecast. Checked ${ist(m.updated)}.</p>`}
function evDays(e){const t=Date.parse(new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"})+"T00:00:00+05:30");return Math.round((Date.parse(e.date+"T00:00:00+05:30")-t)/86400000)}
function evList(){return D.e.filter(e=>e.date&&e.verified&&evDays(e)>=0).sort((p,q)=>p.date.localeCompare(q.date))}
function remBox(){const r=evList().filter(e=>evDays(e)<=2);return r.length?`<div class="box warn"><b>Coming up</b>`+r.map(e=>`<p>${esc(e.name)}<br><span class="m">${evDays(e)===0?"Today":evDays(e)===1?"Tomorrow":"In 2 days"} · ${fd(e.date)}${e.time?" · "+esc(e.time):""}</span></p>`).join("")+`</div>`:""}
function evUpdate(){return `<div class="box"><b>Update events now</b><p class="m">This opens GitHub. Tap Run workflow, then the green Run workflow button. You must be logged into GitHub. The calendar updates in about a minute; then come back and reopen this tab.</p><a class="golink" href="https://github.com/MyMktNewsVY/market-news/actions/workflows/events.yml" target="_blank" rel="noopener">Update events now</a></div>`}
function events(){let h="<h2>Events</h2>";const up=evList(),age=D.ev?Math.round((Date.now()-Date.parse(D.ev+"T00:00:00+05:30"))/86400000):999;
 if(age>20)h+=`<div class="box bad"><b>Calendar not refreshed since ${D.ev?fd(D.ev):"unknown"}.</b><br>The automatic 15-day refresh may have failed. Dates below could be out of date.</div>`;
 if(up.length&&up.length<3)h+=`<div class="box warn">Only ${up.length} upcoming date${up.length>1?"s are":" is"} listed. New official schedules may need adding.</div>`;
 if(!up.length)return h+`<div class="box warn">No upcoming verified events. The calendar needs updating${D.ev?" (last checked "+fd(D.ev)+")":""}.</div>`+evUpdate();
 return h+up.map(e=>{const d=evDays(e),w=d===0?"Today":d===1?"Tomorrow":"In "+d+" days";
  return `<div class="box ${d<=2?"warn":""}"><b>${esc(e.name)}</b>${d<=2?` <span class="tag">Reminder</span>`:""}<div class="m">${fd(e.date)}${e.time?" · "+esc(e.time):""} · ${w}</div><p>${esc(e.why||"")}</p>${e.note?`<p class="m">${esc(e.note)}</p>`:""}${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">Official source</a>`:""}</div>`}).join("")+`<p class="foot">Only dates found in official or published schedules are listed. Reminders show 2 days before. Calendar last checked ${D.ev?fd(D.ev):"unknown"}.</p>`+evUpdate()}
let HC={},HO=null;
const fd=d=>new Date(d+"T00:00:00+05:30").toLocaleDateString("en-IN",{timeZone:"Asia/Kolkata",day:"numeric",month:"short",year:"numeric"});
function earn(){const r=D.res;let h="<h2>Results calendar</h2>";
 const t=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"});
 const items=((r&&r.items)||[]).filter(x=>x.date>=t);
 if(!items.length)h+=`<div class="box warn"><b>No company results found in the news yet.</b><br>We only list companies that a news article says will announce results. Use the official calendars below for the full list.</div>`;
 else{const days={};items.forEach(x=>{(days[x.date]=days[x.date]||[]).push(x)});
  Object.keys(days).sort().forEach(d=>{h+=`<div class="box"><b>${d===t?"Today":fd(d)}</b> <span class="m">${d===t?fd(d):""}</span>`+days[d].map(x=>`<div style="padding:4px 0">${esc(x.company)} <span class="m">· <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.outlet)}</a></span></div>`).join("")+`</div>`})}
 h+=`<div class="box"><b>Full official lists</b><p class="m">Companies tell NSE and BSE their result dates in advance. These are the exchanges' own calendars. I have not tested these links from here.</p><a href="https://www.nseindia.com/companies-listing/corporate-filings-event-calendar" target="_blank" rel="noopener">NSE event calendar</a><br><a href="https://www.bseindia.com/corporates/Forth_Results.aspx" target="_blank" rel="noopener">BSE forthcoming results</a></div><p class="foot">${r&&r.updated?"Last updated "+ist(r.updated)+". ":""}Names come from news articles that list results, and each one links to its article. The list is not complete.</p>`;
 return h}
function hist(){let h="<h2>Past reports</h2>";if(!D.h.length)return h+`<div class="box warn">No saved reports yet.</div>`;
 return h+D.h.map(x=>{const o=HO===x.date,c=HC[x.date];let b="";
  if(o){if(!c)b=`<p class="m">Loading...</p>`;else if(c.err)b=`<p class="m">Could not load this report.</p>`;
   else b=(c.stories||[]).length?(c.stories||[]).map(s=>`<p><a href="${esc((s.sources&&s.sources[0]&&s.sources[0].url)||"#")}" target="_blank" rel="noopener">${esc(s.headline)}</a><br><span class="m">${esc((s.sources&&s.sources[0]&&s.sources[0].name)||"")} · ${esc(s.confirmation||"")}</span></p>`).join(""):`<p class="m">No stories in this report.</p>`}
  return `<div class="box"><button class="go" style="width:100%;text-align:left" onclick="openH('${x.date}')">Report for ${fd(x.date)} ${o?"&#9650;":"&#9660;"}</button>${b}</div>`}).join("")}
async function openH(d){HO=HO===d?null:d;draw();if(HO&&!HC[d]){const x=D.h.find(r=>r.date===d);try{const r=await fetch(x.file,{cache:"no-store"});HC[d]=await r.json()}catch(e){HC[d]={err:1}}draw()}}
function status(){const r=D.r;let n=("Notification" in window)?Notification.permission:"unsupported";
 return `<h2>Status</h2><div class="box"><b>Last report</b><br>${r&&r.generated_at?ist(r.generated_at):"none yet"}</div>
 <div class="box"><b>Phone alerts</b><p class="m">The free ntfy app sends an alert when a report is ready and when an event is 2 days away. Install it once and subscribe to your private topic.</p></div>
 <div class="box"><b>Report time</b><p class="m">8:00 AM IST cutoff. Coverage: previous day 3:00 PM to 8:00 AM IST.</p></div>
 <button class="go" onclick="load()">Refresh</button>`}
async function notif(){if(!("Notification" in window))return alert("This browser does not support notifications.");
 const p=await Notification.requestPermission();if(p==="granted"){const g=await navigator.serviceWorker.ready;g.showNotification("Market Brief",{body:"Test notification works.",icon:"icon.svg"})}draw()}
function menu(f){const m=$("#menu"),o=f!==undefined?f:m.style.display!=="block";m.style.display=o?"block":"none";$("#mb").setAttribute("aria-expanded",o)}
function go(t){menu(false);tab=t;draw();scrollTo(0,0)}
document.addEventListener("click",e=>{if(!e.target.closest("#menu,#mb"))menu(false)});
function draw(){$("#v").innerHTML={today,report,cover,fii,mkt,events,earn,hist,status}[tab]();
 $("#nav").innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
load();
</script></body></html>
